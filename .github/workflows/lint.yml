name: lint

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-tidy libgpiod-dev libgpiodcxx-dev

      - name: Configure (clang-tidy enabled)
        run: cmake --preset lint

      - name: Run clang-tidy (via build)
        run: |
          set -o pipefail
          cmake --build --preset lint 2>&1 | tee clang-tidy.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
