name: lint

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-tidy

      - name: Configure (export compile commands)
        run: cmake -S . -B build_clang_tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          set -o pipefail
          run-clang-tidy -p build_clang_tidy -quiet 'src/.*\.cpp$' 2>&1 | tee clang-tidy.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
