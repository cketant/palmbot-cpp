name: lint

on:
  workflow_call:

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-tidy pkg-config

      - name: Download libgpiod
        uses: actions/download-artifact@v4
        with:
          name: libgpiod-install
          path: ~/

      - name: Expose libgpiod to CMake
        run: |
          tar -xzf "$HOME/libgpiod-install.tar.gz" -C "$HOME"
          echo "PKG_CONFIG_PATH=$HOME/libgpiod-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/libgpiod-install/lib" >> "$GITHUB_ENV"

      - name: Configure (clang-tidy enabled)
        run: cmake --preset lint

      - name: Run clang-tidy (via build)
        run: |
          set -o pipefail
          cmake --build --preset lint 2>&1 | tee clang-tidy.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: clang-tidy.log
