name: test

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

jobs:
  libgpiod:
    uses: ./.github/workflows/libgpiod.yml

  test:
    needs: [libgpiod, lint]
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Download libgpiod
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.libgpiod.outputs.artifact-name }}
          path: ~/

      - name: Expose libgpiod to CMake
        run: |
          tar -xzf "$HOME/libgpiod-install.tar.gz" -C "$HOME"
          echo "PKG_CONFIG_PATH=$HOME/libgpiod-install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/libgpiod-install/lib" >> "$GITHUB_ENV"

      - name: Configure (tests enabled)
        run: cmake --preset test

      - name: Build tests
        run: cmake --build --preset test

      - name: Run tests
        run: ctest --preset test --output-junit test-report.xml

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/test/test-report.xml
